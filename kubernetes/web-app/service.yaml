apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: default
  labels:
    app: web-app
spec:
  # ClusterIP = reachable inside the cluster. Switch type to LoadBalancer
  # to expose it on the LAN through Traefik (then it gets a 192.168.1.x IP).
  type: ClusterIP
  selector:
    app: web-app
  ports:
    - name: http
      port: 80
      targetPort: 80
