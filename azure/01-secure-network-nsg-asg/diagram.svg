<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="560" fill="#ffffff"/>
  <defs>
    <marker id="allow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="deny" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>

  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">Azure Secure Network , two-tier VNet</text>
  <text x="30" y="58" font-size="13" fill="#64748b">NSG least-privilege + ASG role-based rules + private backend tier. Verified with Network Watcher.</text>

  <!-- Internet -->
  <rect x="24" y="150" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="99" y="180" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Internet</text>
  <text x="99" y="200" font-size="11" fill="#64748b" text-anchor="middle">the whole world</text>

  <!-- Home IP -->
  <rect x="24" y="330" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="99" y="360" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Your home IP</text>
  <text x="99" y="380" font-size="11" fill="#64748b" text-anchor="middle">SSH allowed from here only</text>

  <!-- VNet -->
  <rect x="220" y="90" width="700" height="440" rx="14" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="116" font-size="14" font-weight="700" fill="#2563eb">VNet  scVNet-se   10.0.0.0/16</text>

  <!-- Web subnet -->
  <rect x="250" y="140" width="290" height="360" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="270" y="166" font-size="13" font-weight="700" fill="#047857">Web-subnet  10.0.1.0/24</text>
  <rect x="285" y="250" width="220" height="150" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="395" y="286" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">web-vm</text>
  <text x="395" y="310" font-size="11" fill="#334155" text-anchor="middle">public IP  +  10.0.1.4</text>
  <text x="395" y="330" font-size="11" fill="#334155" text-anchor="middle">nginx on :80</text>
  <text x="395" y="356" font-size="11" fill="#047857" text-anchor="middle" font-weight="600">in ASG: asg-web</text>
  <text x="395" y="384" font-size="10.5" fill="#64748b" text-anchor="middle">web-nsg: allow 80 (any), allow 22 (my IP)</text>

  <!-- App subnet -->
  <rect x="590" y="140" width="300" height="360" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="610" y="166" font-size="13" font-weight="700" fill="#334155">App-subnet  10.0.2.0/24  (private)</text>
  <rect x="625" y="250" width="230" height="150" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="740" y="286" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">app-vm</text>
  <text x="740" y="310" font-size="11" fill="#334155" text-anchor="middle">NO public IP  ,  10.0.2.4</text>
  <text x="740" y="330" font-size="11" fill="#334155" text-anchor="middle">nginx on :80</text>
  <text x="740" y="358" font-size="10.5" fill="#64748b" text-anchor="middle">app-nsg: allow from asg-web (80/22),</text>
  <text x="740" y="373" font-size="10.5" fill="#64748b" text-anchor="middle">then DenyAll from VirtualNetwork</text>

  <!-- Internet -> web :80 allow -->
  <line x1="174" y1="175" x2="283" y2="285" stroke="#16a34a" stroke-width="2" marker-end="url(#allow)"/>
  <text x="196" y="210" font-size="11" fill="#16a34a" font-weight="600">:80 allow</text>

  <!-- Internet -> web :22 deny -->
  <line x1="174" y1="200" x2="283" y2="330" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#deny)"/>
  <text x="196" y="300" font-size="11" fill="#dc2626" font-weight="600">:22 deny</text>

  <!-- Home -> web :22 allow -->
  <line x1="174" y1="360" x2="283" y2="360" stroke="#16a34a" stroke-width="2" marker-end="url(#allow)"/>
  <text x="188" y="352" font-size="11" fill="#16a34a" font-weight="600">:22 allow (my IP)</text>

  <!-- web -> app allow via asg -->
  <line x1="505" y1="325" x2="623" y2="325" stroke="#16a34a" stroke-width="2.5" marker-end="url(#allow)"/>
  <text x="512" y="315" font-size="11" fill="#16a34a" font-weight="600">:80 / :22 allow</text>
  <text x="512" y="343" font-size="10" fill="#047857">(source = asg-web)</text>

  <!-- Internet -> app blocked -->
  <path d="M120,220 C120,470 420,500 622,440" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#deny)"/>
  <text x="300" y="515" font-size="11.5" fill="#dc2626" font-weight="700">Internet , app-vm: BLOCKED (no public IP + DenyAll)</text>

  <text x="700" y="548" font-size="10.5" fill="#94a3b8">Built on the Azure CLI. Proven with: az network watcher test-ip-flow.</text>
</svg>
